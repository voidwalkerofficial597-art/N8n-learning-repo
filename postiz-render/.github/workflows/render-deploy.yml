# =============================================================================
# (OPTIONAL) GitHub push -> Render deploy trigger
# =============================================================================
# Render ka apna auto-deploy already kaam karta hai (render.yaml me
# `autoDeployTrigger: commit`). Ye workflow tab kaam aata hai jab aap chahte ho ki:
#   - sirf kuch files badalne par deploy ho (paths filter), ya
#   - kisi specific branch par hi deploy ho, ya
#   - manual button se deploy ho
#
# Setup:
#   1. Render -> apni service -> Settings -> Deploy Hook -> copy URL
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions
#      New repository secret -> name: RENDER_DEPLOY_HOOK_URL -> value: wo URL
#
# Agar secret set nahi hai to ye workflow chup-chaap skip ho jata hai.
# =============================================================================

name: Deploy to Render

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'render.yaml'
      - 'temporal/**'
      - '.github/workflows/render-deploy.yml'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Render deploy trigger kar rahe hain..."
          curl -fsS -X POST "$HOOK" -o /dev/null -w "HTTP %{http_code}\n"
          echo "✅ Render dashboard -> Deploys me progress dekho"

      - name: Secret missing hone par note
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL == '' }}
        run: |
          echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret set nahi hai — workflow skip."
          echo "   Render ka built-in auto-deploy phir bhi kaam karega."
